# Development reverse proxy.
#
# The browser talks to one origin (http://localhost:8080) for both the frontend
# and the API, which keeps cookie and CORS behaviour close to production even
# though the frontend is served by the Vite dev server.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # nginx only bounds what it accepts; the API validates uploads itself.
    client_max_body_size 10m;

    # Docker's embedded DNS. Resolving upstreams per request keeps nginx alive
    # while a service restarts and picks up its new address afterwards.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # WebSocket connections are long lived, and dev responses stream.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;

    # Lets this container report healthy without depending on the app services.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API. The path is passed through unchanged, so the backend keeps
    # owning the /api prefix.
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
    }

    # Socket.IO, including the HTTP upgrade handshake.
    location /socket.io/ {
        set $socket_upstream http://api:3000;
        proxy_pass $socket_upstream$request_uri;
    }

    # Everything else is the Vite dev server, whose hot-reload channel is also
    # a WebSocket.
    location / {
        set $web_upstream http://web:5173;
        proxy_pass $web_upstream$request_uri;
    }
}
