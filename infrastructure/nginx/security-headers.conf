# Baseline browser isolation for the compiled SPA. Included from every
# location that emits add_header, because nginx does not inherit those
# directives into nested locations.
#
# upgrade-insecure-requests is omitted on purpose: the local production compose
# file publishes HTTP on localhost. Enable it only behind real TLS termination.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss: ws:" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
