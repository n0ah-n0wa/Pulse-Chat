# Shared reverse-proxy request headers for the production front nginx.
#
# X-Forwarded-For is overwritten with the connecting address (not appended)
# because Nest trusts a single proxy hop. See configure-application.ts.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
