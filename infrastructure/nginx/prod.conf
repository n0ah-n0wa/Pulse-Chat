# Front-facing production reverse proxy.
#
# The browser talks to one origin. Nginx load-balances REST and WebSocket
# upgrades across api-1 and api-2 (least_conn so a live socket on one instance
# sends the next handshake to the other). Socket.IO is websocket-only, so
# sticky sessions are not required for the Engine.IO handshake. Cross-instance
# event delivery is Redis Pub/Sub, not Socket.IO's own adapter.
#
# Static assets and SPA routes come from the `web` container. API routing is
# owned here, not by the SPA image.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pulse_api {
    least_conn;
    server api-1:3000 max_fails=3 fail_timeout=15s;
    server api-2:3000 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Matches ATTACHMENT_MAX_BYTES / REQUEST_BODY_LIMIT (10 MiB). Nginx counts
    # the whole request, including multipart wrappers, so keep this aligned
    # with the API rather than raising it.
    client_max_body_size 10m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Docker's embedded DNS, used for the web upstream so nginx survives a
    # web-container restart. The API upstream uses the static server list above
    # so two named instances are load-balanced rather than hashed to one name.
    resolver 127.0.0.11 ipv6=off valid=10s;

    error_page 502 503 504 @upstream_error;

    location @upstream_error {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 502 "upstream unavailable\n";
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API. The /api prefix is passed through unchanged.
    location /api/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_pass http://pulse_api;
    }

    # Health probes live outside the /api prefix (see configure-application.ts).
    location /health {
        include /etc/nginx/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_pass http://pulse_api;
    }

    # Socket.IO, including the HTTP upgrade handshake.
    location /socket.io/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass http://pulse_api;
    }

    # Hashed Vite assets. Cache-Control is set by the web image; this location
    # exists so /assets is never treated as an SPA route at this layer.
    location /assets/ {
        include /etc/nginx/proxy-headers.conf;
        set $web_upstream http://web:80;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass $web_upstream;
    }

    # Client-side routing: unknown paths are application routes on the SPA.
    location / {
        include /etc/nginx/proxy-headers.conf;
        set $web_upstream http://web:80;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass $web_upstream;
    }
}
